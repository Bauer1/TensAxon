name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (GCC)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Ubuntu (Clang)
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS (AppleClang)
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: Windows (MSVC)
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTENSAXON_BUILD_TESTS=ON -DTENSAXON_BUILD_EXAMPLES=ON

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DTENSAXON_BUILD_TESTS=ON -DTENSAXON_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
